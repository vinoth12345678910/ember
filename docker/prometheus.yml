# Scrapes the admin port of the three brokers every 5 seconds (inside the compose network the admin port is 8080).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ember
    static_configs:
      - targets: ["ember1:8080"]
        labels: {node: "1"}
      - targets: ["ember2:8080"]
        labels: {node: "2"}
      - targets: ["ember3:8080"]
        labels: {node: "3"}
